name: Build Native Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows Desktop Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run electron:build

      - name: Normalize Windows installer name
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist-electron -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw "electron-builder did not produce an .exe installer." }
          Copy-Item $exe.FullName "dist-electron/Sameer-AI-Workspace-Setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-electron/Sameer-AI-Workspace-Setup.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install mobile dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync native project
        run: npx cap sync android

      - name: Build installable APK
        run: ./android/gradlew --no-daemon assembleDebug

      - name: Normalize APK name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sameer-AI-Workspace-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/Sameer-AI-Workspace-Android.apk
          if-no-files-found: error

  publish:
    name: Publish Latest Native Apps
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: native-artifacts

      - name: Prepare release files
        run: |
          mkdir release
          cp native-artifacts/windows-installer/Sameer-AI-Workspace-Setup.exe release/
          cp native-artifacts/android-apk/Sameer-AI-Workspace-Android.apk release/
          ls -lh release/

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sameer AI Workspace — Latest Native Apps
          body: |
            Native desktop and Android installers for Sameer AI Workspace.

            - Windows: Sameer-AI-Workspace-Setup.exe
            - Android: Sameer-AI-Workspace-Android.apk

            The web application remains at the existing production URL.
          files: |
            release/Sameer-AI-Workspace-Setup.exe
            release/Sameer-AI-Workspace-Android.apk
          make_latest: true
          prerelease: false
