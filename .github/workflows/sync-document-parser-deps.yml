name: Sync Document Parser Dependencies

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: "!startsWith(github.event.head_commit.message, 'deps:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add parser dependencies and refresh lockfile
        run: npm install --save pdf-parse@2.4.5 mammoth@1.11.0 xlsx@0.18.5
      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "deps: sync document parser dependencies [skip ci]"
          git push
