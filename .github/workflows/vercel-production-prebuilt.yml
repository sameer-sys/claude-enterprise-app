name: Deploy Production to Vercel (Prebuilt)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_UCHZQS7sm8e3vpPzeVVJsSDe
      VERCEL_PROJECT_ID: prj_Gz0D5y8GKtkcc4BizH3OhsG1sPMV
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN GitHub repository secret is not configured."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build locally for Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production artifact
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --yes
